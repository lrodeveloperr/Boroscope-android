    const paths={folder:'M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z',help:'M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm0-14a4 4 0 0 0-4 4h2a2 2 0 1 1 2.8 1.84c-1.1.48-1.8 1.5-1.8 2.66V15h2v-.5c0-.4.24-.77.62-.93A4 4 0 0 0 12 6z',warning:'M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z',back:'M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.42-1.41L7.83 13H20v-2z',photo:'M9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.2a2.8 2.8 0 1 0 0-5.6 2.8 2.8 0 0 0 0 5.6z',video:'M17 10.5V7c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h13c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z',rotate:'M15.55 5.55 11 1v3.07a8 8 0 1 0 7.93 9.07h-2.02A6 6 0 1 1 11 6.08V10l4.55-4.45z',switch:'M6.99 11 3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z',share:'M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A3 3 0 1 0 15 5c0 .24.04.47.09.7L8.04 9.81A3 3 0 1 0 6 15c.78 0 1.49-.3 2.02-.79l7.12 4.16c-.04.2-.07.41-.07.63a3 3 0 1 0 3-2.92z',trash:'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5-1-1h-5l-1 1H5v2h14V4z',stop:'M6 6h12v12H6z'};

    function setPhase(phase,message,detail=null){state.phase=phase;state.message=message;state.detail=detail;render();persist();}
    function setPage(page){if(state.recording)return;state.page=page;render();persist();}
    function actionButton(label){return `<button id="primaryAction" class="primary">${escapeHtml(t(label))}</button>`;}
    function renderConnection(){const card=$('connectionCard'),testing=state.phase==='TESTING',isError=state.phase==='ERROR';card.hidden=['LIVE','PAUSED_FOR_UNLOCK'].includes(state.phase);if(card.hidden)return;let extra='',action='';if(testing)extra=`<p>Safe profile ${state.attempt} of 3</p>`;if(state.phase==='WAITING_FOR_DEVICE')extra='<p class="steps">1. Plug the camera into an OTG adapter\n2. Connect it directly to the phone\n3. Approve Android’s prompts</p>';if(state.phase==='CAMERA_PERMISSION_REQUIRED')action=actionButton('Allow access');if(state.phase==='USB_PERMISSION_REQUIRED')action=actionButton('Allow USB');if(isError)action=actionButton('Try again');card.innerHTML=`${testing?'<div class="spinner"></div>':`<svg class="camera-glyph ${isError?'warning':''}" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="${paths[isError?'warning':'video']}" ></path></svg>`}<h2>${escapeHtml(state.message)}</h2>${state.detail?`<p>${escapeHtml(state.detail)}</p>`:''}${extra}${action}`;const actionEl=$('primaryAction');if(actionEl)actionEl.onclick=primaryAction;}

    function renderControls(){const live=state.phase==='LIVE'&&(state.unlocked||state.remaining>0);const bar=$('captureBar');bar.hidden=!live;if(!live)return;const photoLabel=!state.unlocked&&state.photoUsed?'Photo used':'Photo';const videoLabel=state.recording?'Stop':(!state.unlocked&&state.videoUsed?'Video used':'Record');bar.innerHTML=`${control('rotate','Rotate','rotateAction')}${state.devices>1?control('switch','Lens','switchAction'):''}${control('photo',photoLabel,'photoAction',!state.unlocked&&state.photoUsed)}${control(state.recording?'stop':'video',videoLabel,'videoAction',!state.recording&&!state.unlocked&&state.videoUsed,state.recording)}`;for(const [id,fn] of [['rotateAction',rotate],['switchAction',switchDevice],['photoAction',takePhoto],['videoAction',toggleRecording]]){const el=$(id);if(el)el.onclick=fn;}}
    function control(iconName,label,id,disabled=false,recording=false){const localized=t(label);return `<button id="${id}" class="control ${recording?'recording':''}" ${disabled?'disabled':''} aria-label="${escapeHtml(localized)}"><span class="control-circle">${icon(iconName)}</span><span class="control-label">${escapeHtml(localized)}</span></button>`;}
    function renderCamera(){const status=[t(state.message),state.phase==='LIVE'?'1280×720 · UVC':null].filter(Boolean).join(' · ');$('status').textContent=status;$('galleryButton').innerHTML=icon('folder');$('helpButton').innerHTML=icon('help');$('galleryButton').disabled=state.recording;$('helpButton').disabled=state.recording;$('galleryButton').onclick=()=>setPage('gallery');$('helpButton').onclick=()=>setPage('help');const trial=$('trialBadge');trial.hidden=state.unlocked||state.phase!=='LIVE';trial.textContent=t(`Compatibility preview ${formatTime(state.remaining)}`);$('feedLabel').hidden=state.phase==='LIVE';$('feedCanvas').style.transform=`rotate(${state.rotation}deg) scale(${state.rotation%180?1.35:1})`;renderConnection();renderUnlock();renderControls();}

    function renderHelp(){const page=$('helpPage');page.innerHTML=`<div class="page-header"><button id="helpBack" class="icon-btn" aria-label="Back">${icon('back')}</button><h1>Help &amp; compatibility</h1></div><div class="help-stack"><article class="help-card"><h2>What works</h2><p>Standard UVC USB endoscopes over Android OTG. The app tests 720p MJPEG, 480p MJPEG, then 480p YUYV.</p></article><article class="help-card"><h2>Dual-lens cameras</h2><p>Lens appears only when Android exposes separate USB video devices. If your cable has a lens button, use that button; proprietary switching cannot be guaranteed.</p></article><article class="help-card"><h2>Privacy</h2><p>No account, ads, analytics, cloud upload, location, microphone, or phone-camera access. Captures stay in this app’s local folder until you share them.</p></article><article class="help-card"><h2>Safety</h2><p>For general inspection only. This is not a medical device and must not be used on people or animals.</p></article><button id="shareReport" class="secondary">${icon('share')} Share compatibility report</button><button id="toggleReport" class="link-btn">${state.showReport?'Hide':'Show'} technical report</button>${state.showReport?`<div class="report">${escapeHtml(report())}</div>`:''}</div>`;$('helpBack').onclick=()=>setPage('camera');$('shareReport').onclick=()=>shareText(report(),'Compatibility report copied');$('toggleReport').onclick=()=>{state.showReport=!state.showReport;renderHelp();persist();};}
    function render(){for(const page of ['camera','gallery','help']){$(`${page}Page`).classList.toggle('active',state.page===page);}if(state.page==='camera')renderCamera();if(state.page==='gallery')renderGallery();if(state.page==='help')renderHelp();}
    function primaryAction(){if(state.phase==='CAMERA_PERMISSION_REQUIRED')setPhase('USB_PERMISSION_REQUIRED','Allow this USB endoscope','Android will show a system permission prompt.');else if(state.phase==='USB_PERMISSION_REQUIRED')runCompatibility(true);else if(state.phase==='ERROR'){if(state.devices)runCompatibility(state.message!=='No usable UVC video format found');else setPhase('WAITING_FOR_DEVICE','Connect a USB endoscope');}}
    function attach(devices){generation++;state.devices=devices;state.attempt=0;setPhase('CAMERA_PERMISSION_REQUIRED','Allow USB video access','Android calls this Camera permission; Borescope Direct never opens the phone cameras.');}
    function runCompatibility(success){const token=++generation;state.attempt=1;setPhase('TESTING',`Testing ${profiles[0]}`,'Waiting for stable video frames…');const advance=()=>{if(token!==generation)return;if(success){setPhase('LIVE','Camera ready');lastTick=performance.now();return;}if(state.attempt<3){state.attempt++;state.message=`Testing ${profiles[state.attempt-1]}`;render();setTimeout(advance,700);}else setPhase('ERROR','No usable UVC video format found','Tried 720p MJPEG, 480p MJPEG, and 480p YUYV. The camera may be proprietary, under-powered, or not UVC.');};setTimeout(advance,700);}
    function rotate(){state.rotation=(state.rotation+90)%360;render();persist();}
    function switchDevice(){if(state.devices<2||state.recording)return;state.deviceIndex=(state.deviceIndex+1)%state.devices;state.message=`Camera ${state.deviceIndex+1} ready`;render();persist();showToast(`Switched to camera ${state.deviceIndex+1}`);}
    function newId(){return globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;}
    function takePhoto(){if(!state.unlocked&&state.photoUsed)return;const capture={id:newId(),type:'Photo',createdAt:Date.now(),size:1480000+Math.floor(Math.random()*540000)};state.captures.unshift(capture);if(!state.unlocked)state.photoUsed=true;state.message='Photo saved in Gallery';render();persist();showToast('Photo saved in Gallery');}
    function toggleRecording(){if(state.recording){finishRecording();return;}if(!state.unlocked&&state.videoUsed)return;state.recording=true;recordStartedAt=Date.now();state.message='Recording';render();clearTimeout(recordTimer);if(!state.unlocked)recordTimer=setTimeout(finishRecording,10000);}
    function finishRecording(){if(!state.recording)return;clearTimeout(recordTimer);const seconds=Math.max(1,Math.round((Date.now()-recordStartedAt)/1000));state.recording=false;state.captures.unshift({id:newId(),type:'Video',createdAt:Date.now(),duration:seconds,size:seconds*2100000});if(!state.unlocked)state.videoUsed=true;state.message='Recording saved in Gallery';render();persist();showToast('Recording saved in Gallery');}
    function purchase(){if(state.billingOffline)return;state.purchaseOwned=true;state.unlocked=true;state.billingMessage='Purchase restored';state.message='Camera ready';setPhase('LIVE','Camera ready');showToast('Unlimited inspections unlocked');}
    function restorePurchase(){if(state.purchaseOwned){state.unlocked=true;state.billingMessage='Purchase restored';setPhase('LIVE','Camera ready');showToast('Purchase restored');}else{state.billingMessage=state.billingOffline?'Google Play is unavailable. Check your connection and try again.':'No completed purchase was found for this Play account.';render();persist();}}
    function openMedia(id){const item=state.captures.find(x=>x.id===id);if(!item)return showToast('That capture is no longer available');const modal=$('mediaModal');modal.innerHTML=`<div class="modal-card"><div class="modal-preview">${item.type==='Video'?'▶ Video':'Photo'}</div><h2 id="modalTitle">${item.type}</h2><p>${formatDate(item.createdAt)} · ${formatBytes(item.size)}${item.duration?` · ${item.duration}s`:''}</p><div class="modal-actions"><button id="modalShare" class="secondary">Share</button><button id="modalClose" class="primary">Close</button></div></div>`;modal.classList.add('open');$('modalClose').onclick=closeModal;$('modalShare').onclick=()=>shareMedia(id);}
    function closeModal(){$('mediaModal').classList.remove('open');$('mediaModal').innerHTML='';}
    function deleteMedia(id){const item=state.captures.find(x=>x.id===id);if(!item)return;if(!confirm(`Delete ${item.type.toLowerCase()} captured ${formatDate(item.createdAt)}?`))return;state.captures=state.captures.filter(x=>x.id!==id);renderGallery();persist();showToast('Capture deleted');}
    function shareMedia(id){const item=state.captures.find(x=>x.id===id);if(!item)return showToast('That capture is no longer available');shareText(`Borescope Direct ${item.type.toLowerCase()} — ${formatDate(item.createdAt)}`,'Capture details copied');}
    async function shareText(text,fallback){text=globalThis.bdL10n?.translate(text)||text;fallback=globalThis.bdL10n?.translate(fallback)||fallback;try{if(navigator.share){await navigator.share({title:'Borescope Direct',text});return;}if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);}else{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();if(!document.execCommand('copy'))throw new Error('copy failed');area.remove();}showToast(fallback);}catch(error){if(error&&error.name!=='AbortError')showToast(globalThis.bdL10n?.translate('No app can share this item')||'No app can share this item');}}
    function applyPreset(name){clearTimeout(recordTimer);generation++;state.recording=false;closeModal();if(name==='reset'){try{localStorage.removeItem(STORAGE_KEY);}catch{}state=defaults();render();showToast('Preview data reset');return;}if(name==='fresh'){state=defaults();render();persist();return;}if(name!=='billing'){state.billingOffline=false;state.billingMessage=null;}if(name==='one'){attach(1);return;}if(name==='two'){state.devices=2;state.remaining=Math.max(state.remaining,30000);runCompatibility(true);return;}if(name==='denied'){state.devices=1;setPhase('CAMERA_PERMISSION_REQUIRED','Camera permission is needed for USB video','Android requires this permission for UVC cameras. The phone cameras are never opened.');return;}if(name==='failed'){state.devices=1;runCompatibility(false);return;}if(name==='expired'){state.devices=Math.max(1,state.devices);state.remaining=0;state.unlocked=false;setPhase('PAUSED_FOR_UNLOCK','Compatibility confirmed');return;}if(name==='billing'){state.devices=Math.max(1,state.devices);state.remaining=0;state.unlocked=false;state.billingOffline=true;state.billingMessage='Google Play is unavailable. Check your connection and try again.';setPhase('PAUSED_FOR_UNLOCK','Compatibility confirmed');}}
    function tick(now){if(state.phase==='LIVE'&&!state.unlocked&&state.remaining>0&&!document.hidden){state.remaining=clamp(state.remaining-(now-lastTick),0,TRIAL_MS);if(now-lastPersist>1000){lastPersist=now;persist();}if(state.remaining<=0){generation++;state.phase='PAUSED_FOR_UNLOCK';state.message='Compatibility confirmed';render();persist();}else if(Math.floor(state.remaining/1000)!==Math.floor((state.remaining+(now-lastTick))/1000))renderCamera();}lastTick=now;requestAnimationFrame(tick);}
    function drawFeed(){const canvas=$('feedCanvas'),ctx=canvas.getContext('2d');function frame(t){const dpr=Math.min(devicePixelRatio||1,2),w=Math.max(1,canvas.clientWidth),h=Math.max(1,canvas.clientHeight);if(canvas.width!==Math.floor(w*dpr)||canvas.height!==Math.floor(h*dpr)){canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#050808';ctx.fillRect(0,0,w,h);if(state.phase==='LIVE'){const x=w*(.48+.05*Math.sin(t/1900+state.deviceIndex)),y=h*(.5+.04*Math.cos(t/2300)),r=Math.max(w,h)*.42;const g=ctx.createRadialGradient(x,y,r*.05,x,y,r);g.addColorStop(0,state.deviceIndex?'#a8b6ad':'#9aa69d');g.addColorStop(.16,'#52635d');g.addColorStop(.38,'#15201e');g.addColorStop(.62,'#050707');g.addColorStop(.78,'#40534e');g.addColorStop(1,'#080b0b');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.strokeStyle='rgba(190,220,210,.16)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y,r*.56,r*.35,Math.sin(t/5000)*.08,0,Math.PI*2);ctx.stroke();if(state.recording){ctx.fillStyle='#e14a42';ctx.beginPath();ctx.arc(22,86,6,0,Math.PI*2);ctx.fill();}}requestAnimationFrame(frame);}requestAnimationFrame(frame);}
    function formatTime(ms){const sec=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;}
    function formatPreviewPrice(){return new Intl.NumberFormat(globalThis.bdL10n?.locale||undefined,{style:'currency',currency:'USD'}).format(5.99);}
    function formatBytes(bytes){const nf=new Intl.NumberFormat(globalThis.bdL10n?.locale||undefined,{maximumFractionDigits:1});if(bytes<1000)return `${nf.format(bytes)} B`;if(bytes<1e6)return `${nf.format(bytes/1000)} KB`;return `${nf.format(bytes/1e6)} MB`;}
    function formatDate(value){return new Intl.DateTimeFormat(globalThis.bdL10n?.locale||undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date(value));}
    function escapeHtml(value){return String(value??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}
    document.querySelectorAll('[data-preset]').forEach(btn=>btn.onclick=()=>applyPreset(btn.dataset.preset));
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){if($('mediaModal').classList.contains('open'))closeModal();else if(state.page!=='camera')setPage('camera');}});
    document.addEventListener('visibilitychange',()=>{lastTick=performance.now();persist();});window.addEventListener('beforeunload',persist);window.addEventListener('borescope-locale-change',render);$('mediaModal').onclick=e=>{if(e.target===$('mediaModal'))closeModal();};
    render();drawFeed();requestAnimationFrame(tick);
  })();
  </script>
</body>
