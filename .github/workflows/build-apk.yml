name: Build QA APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: borescope-direct-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Verify source invariants
        run: bash scripts/verify_project.sh

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Stage named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Borescope-Direct-QA-v1.0.0.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Borescope-Direct-QA-v1.0.0
          path: Borescope-Direct-QA-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
